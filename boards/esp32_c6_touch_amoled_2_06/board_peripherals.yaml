peripherals:
  - name: i2c_master
    type: i2c
    role: master
    config:
      port: 0
      pins:
        sda: 8
        scl: 7

  - name: spi_display
    type: spi
    role: master
    config:
      spi_bus_config:
        spi_port: SPI2_HOST
        sclk_io_num: 0
        mosi_io_num: 1
        miso_io_num: 2
        quadwp_io_num: 3
        quadhd_io_num: 4
        max_transfer_sz: 411640  # 410 x 502 pixels at 16 bits per pixel
