# Devices for the Waveshare ESP32-P4-WIFI6-DB 7C board.
devices:
  - name: audio_dac
    chip: es8389
    type: audio_codec
    version: default
    config:
      dac_enabled: true
    peripherals:
      - pa_name: gpio_pa_control
        gain: 6
        active_level: 1
      - i2s_name: i2s_audio_out
      - i2c_name: i2c_master
        address: 0x20
        frequency: 400000

  - name: audio_adc
    chip: es8389
    type: audio_codec
    version: default
    config:
      adc_enabled: true
      adc_cfg:
        # The board exposes two microphone channels, with no echo-reference input.
        label: [FL, FR]
    peripherals:
      - i2s_name: i2s_audio_in
      - i2c_name: i2c_master
        address: 0x20
        frequency: 400000

  - name: display_lcd
    chip: ek79007
    type: display_lcd
    sub_type: dsi
    version: default
    dependencies:
      espressif/esp_lcd_ek79007: "*"
    config:
      reset_gpio_num: 31
      rgb_ele_order: LCD_RGB_ELEMENT_ORDER_RGB
      data_endian: LCD_RGB_DATA_ENDIAN_BIG
      bits_per_pixel: 16
      reset_active_high: 0
      dbi_config:
        virtual_channel: 0
        lcd_cmd_bits: 8
        lcd_param_bits: 8
      dpi_config:
        virtual_channel: 0
        dpi_clk_src: MIPI_DSI_DPI_CLK_SRC_DEFAULT
        dpi_clock_freq_mhz: 48
        in_color_format: LCD_COLOR_FMT_RGB565
        out_color_format: LCD_COLOR_FMT_RGB565
        num_fbs: 3
        flags:
          use_dma2d: false
          disable_lp: false
        video_timing:
          h_size: 1024
          v_size: 600
          hsync_back_porch: 160
          hsync_pulse_width: 10
          hsync_front_porch: 160
          vsync_back_porch: 23
          vsync_pulse_width: 1
          vsync_front_porch: 12
    peripherals:
      - ldo_name: ldo_mipi
      - dsi_name: dsi_display

  - name: lcd_touch
    chip: gt911
    type: lcd_touch
    sub_type: i2c
    version: default
    dependencies:
      espressif/esp_lcd_touch_gt911: "^1.2.0~3"
    config:
      io_i2c_config:
        lcd_cmd_bits: 16
        scl_speed_hz: 400000
      touch_config:
        x_max: 1024
        y_max: 600
        rst_gpio_num: 23
        int_gpio_num: -1
        levels:
          reset: 0
          interrupt: 0
        flags:
          swap_xy: false
          mirror_x: false
          mirror_y: false
    peripherals:
      - i2c_name: i2c_master
        # GT911 addresses are 8-bit values corresponding to 7-bit 0x5D/0x14.
        i2c_addr: [0xBA, 0x28]

  - name: lcd_brightness
    type: ledc_ctrl
    version: 1.0.0
    power_ctrl_device: lcd_backlight_power_ctrl
    config:
      default_percent: 100
    peripherals:
      - ledc_name: ledc_backlight

  # GPIO52 enables the backlight driver, active low.
  - name: lcd_backlight_power_ctrl
    type: power_ctrl
    sub_type: gpio
    peripherals:
      - gpio_name: gpio_lcd_backlight_en
        active_level: 0

  - name: fs_sdcard
    type: fs_fat
    sub_type: sdmmc
    version: default
    power_ctrl_device: sdcard_power_ctrl
    config:
      mount_point: "/sdcard"
      vfs_config:
        format_if_mount_failed: false
        max_files: 5
        allocation_unit_size: 16384
      sub_config:
        slot: SDMMC_HOST_SLOT_0
        frequency: SDMMC_FREQ_HIGHSPEED
        bus_width: 4
        slot_flags: 0
        pins:
          clk: 43
          cmd: 44
          d0: 39
          d1: 40
          d2: 41
          d3: 42
          d4: -1
          d5: -1
          d6: -1
          d7: -1
          cd: -1
          wp: -1
        ldo_chan_id: 4

  - name: fs_spiffs
    type: fs_spiffs
    version: default
    config:
      base_path: "/spiffs"
      partition_label: "storage"
      max_files: 5
      format_if_mount_failed: false

  - name: sdcard_power_ctrl
    type: power_ctrl
    sub_type: gpio
    peripherals:
      - gpio_name: gpio_sd_power
        active_level: 0

  - name: camera
    type: camera
    sub_type: csi
    version: default
    config:
      csi_config:
        reset_io: -1
        pwdn_io: -1
        dont_init_ldo: true
        xclk_config:
          xclk_pin: -1
          xclk_freq_hz: 20000000
    peripherals:
      - i2c_name: i2c_master
        frequency: 100000
      - ldo_name: ldo_mipi

  - name: user_led_1
    type: gpio_ctrl
    version: default
    config:
      active_level: 0
      default_level: 1
    peripherals:
      - gpio_name: gpio_user_led_1

  - name: user_led_2
    type: gpio_ctrl
    version: default
    config:
      active_level: 0
      default_level: 1
    peripherals:
      - gpio_name: gpio_user_led_2
