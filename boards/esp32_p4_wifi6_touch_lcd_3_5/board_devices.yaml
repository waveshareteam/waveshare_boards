devices:
  - name: audio_dac
    type: audio_codec
    chip: es8311
    config:
      adc_enabled: false
      dac_enabled: true
      # MCLK is wired on GPIO13; the ES8311 clock coefficients assume MCLK = 256 * fs.
      sys_cfg:
        no_mclk: false
    peripherals:
      - pa_name: gpio_pa_control
        active_level: 1
      - i2s_name: i2s_audio_out
      - i2c_name: i2c_master
        address: 0x30
        frequency: 400000
  # The same ES8311 records the single analog microphone; no DAC loopback reference is mixed in.
  - name: audio_adc
    type: audio_codec
    chip: es8311
    config:
      adc_enabled: true
      dac_enabled: false
      sys_cfg:
        no_mclk: false
      adc_cfg:
        label: [FC, NA]
    peripherals:
      - i2s_name: i2s_audio_in
      - i2c_name: i2c_master
        address: 0x30
        frequency: 400000
  # App assets and audio prompts; the image is built from firmware/brookesia/spiffs into "storage".
  - name: fs_spiffs
    type: fs_spiffs
    config:
      base_path: "/spiffs"
      partition_label: storage
      max_files: 5
      format_if_mount_failed: false
  # The card IO is powered by LDO VO4; the board has no card supply switch.
  - name: fs_sdcard
    type: fs_fat
    sub_type: sdmmc
    config:
      vfs_config:
        format_if_mount_failed: false
      sub_config:
        slot: SDMMC_HOST_SLOT_0
        frequency: SDMMC_FREQ_HIGHSPEED
        bus_width: 4
        pins:                           # Slot 0 IOMUX pins
          clk: 43
          cmd: 44
          d0: 39
          d1: 40
          d2: 41
          d3: 42
          d4: -1
          d5: -1
          d6: -1
          d7: -1
          cd: -1
          wp: -1
        ldo_chan_id: 4
  - name: display_lcd
    type: display_lcd
    sub_type: spi
    chip: st7796
    dependencies:
      espressif/esp_lcd_st7796: "^1.5.0"
    config:
      swap_xy: false
      mirror_x: true
      mirror_y: false
      x_max: 320
      y_max: 480
      invert_color: true
      need_reset: true
      frame_format: RGB565_BE
      io_spi_config:
        cs_gpio_num: 23
        dc_gpio_num: 26
        spi_mode: 3
        pclk_hz: 80000000
        trans_queue_depth: 10
        lcd_cmd_bits: 8
        lcd_param_bits: 8
      lcd_panel_config:
        reset_gpio_num: 27
        rgb_ele_order: LCD_RGB_ELEMENT_ORDER_BGR
        data_endian: LCD_RGB_DATA_ENDIAN_BIG
        bits_per_pixel: 16
        flags:
          reset_active_high: false
    peripherals:
      - spi_name: spi_lcd
  - name: lcd_touch
    type: lcd_touch
    sub_type: i2c
    chip: ft5x06
    dependencies:
      espressif/esp_lcd_touch_ft5x06: "^1"
    config:
      io_i2c_config:
        lcd_cmd_bits: 8
        scl_speed_hz: 400000
      touch_config:
        x_max: 320
        y_max: 480
        rst_gpio_num: 29
        int_gpio_num: 50
        levels:
          reset: 0
          interrupt: 0
    peripherals:
      - i2c_name: i2c_master
        i2c_addr: [0x70]                # FT6336 8-bit I2C address, from 7-bit 0x38
  - name: lcd_brightness
    type: ledc_ctrl
    config:
      default_percent: 0
    peripherals:
      - ledc_name: ledc_backlight
  - name: camera
    type: camera
    sub_type: csi
    config:
      csi_config:
        reset_io: -1
        pwdn_io: -1
        dont_init_ldo: true
    peripherals:
      - i2c_name: i2c_master
        frequency: 400000
      - ldo_name: ldo_mipi
