peripherals:
  # Shared by the ES8311, the FT6336 touch controller and the OV5647 SCCB.
  - name: i2c_master
    type: i2c
    role: master
    config:
      port: 1
      pins:
        sda: 7
        scl: 8
  # One ES8311 drives both directions on the same I2S port.
  - name: i2s_audio_out
    type: i2s
    role: master
    format: tdm-out
    config: &i2s_config
      port: 1
      sample_rate_hz: 24000
      mclk_multiple: 256
      data_bit_width: 16
      slot_mode: I2S_SLOT_MODE_STEREO
      ws_width: 16
      total_slot: 2
      slot_mask: I2S_TDM_SLOT0 | I2S_TDM_SLOT1
      pins:
        mclk: 13
        bclk: 12
        ws: 10
        dout: 9
        din: 11
  - name: i2s_audio_in
    type: i2s
    role: master
    format: tdm-in
    config:
      <<: *i2s_config
  - name: gpio_pa_control
    type: gpio
    role: io
    config:
      pin: 53
      mode: GPIO_MODE_OUTPUT
      default_level: 0
  # VO3 feeds VDD_MIPI_DPHY, used by the OV5647 MIPI CSI camera.
  - name: ldo_mipi
    type: ldo
    config:
      chan_id: 3
      voltage_mv: 2500
      adjustable: 1
      owned_by_hw: 0
  # ST7796 panel, write-only 4-wire SPI.
  - name: spi_lcd
    type: spi
    role: master
    config:
      spi_bus_config:
        spi_port: SPI2_HOST
        mosi_io_num: 20
        miso_io_num: -1
        sclk_io_num: 21
        quadwp_io_num: -1
        quadhd_io_num: -1
        max_transfer_sz: 307200       # One full 320 x 480 RGB565 frame
  - name: ledc_backlight
    type: ledc
    config:
      gpio_num: 28
      speed_mode: LEDC_LOW_SPEED_MODE
      channel: 1
      timer_sel: 1
      duty: 0
      duty_resolution: LEDC_TIMER_10_BIT
      freq_hz: 5000
      output_invert: false
