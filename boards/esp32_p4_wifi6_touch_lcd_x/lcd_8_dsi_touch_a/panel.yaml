version: 1.0.0
# Waveshare 8-DSI-TOUCH-A: JD9365, 800x1280, 2-lane MIPI DSI, GT911 touch.
# Timing matches the 10.1-DSI-TOUCH-A base; the init sequence lives in lcd_mipi_dsi.c.
peripherals:
  - name: dsi_display
    config:
      data_lanes: 2
      phy_clk_src: 0
      lane_bit_rate_mbps: 1500
devices:
  - name: display_lcd
    chip: jd9365
    dependencies:
      espressif/esp_lcd_jd9365: "^2.0.2"
    config:
      reset_gpio_num: 27
      rgb_ele_order: LCD_RGB_ELEMENT_ORDER_RGB
      bits_per_pixel: 16
      reset_active_high: 0
      dpi_config:
        dpi_clk_src: MIPI_DSI_DPI_CLK_SRC_DEFAULT
        dpi_clock_freq_mhz: 80
        pixel_format: LCD_COLOR_PIXEL_FORMAT_RGB565
        in_color_format: LCD_COLOR_FMT_RGB565
        out_color_format: LCD_COLOR_FMT_RGB565
        num_fbs: 3
        flags:
          use_dma2d: true
        video_timing:
          h_size: 800
          v_size: 1280
          hsync_back_porch: 20
          hsync_pulse_width: 20
          hsync_front_porch: 40
          vsync_back_porch: 12
          vsync_pulse_width: 4
          vsync_front_porch: 30
  - name: lcd_touch
    config:
      touch_config:
        x_max: 800
        y_max: 1280
