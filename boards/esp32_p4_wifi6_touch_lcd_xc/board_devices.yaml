devices:
  - name: audio_dac
    type: audio_codec
    chip: es8311
    config:
      adc_enabled: false
      dac_enabled: true
      # MCLK is wired on GPIO13; the ES8311 clock coefficients assume MCLK = 256 * fs.
      sys_cfg:
        no_mclk: false
    peripherals:
      - pa_name: gpio_pa_control
        active_level: 1
      - i2s_name: i2s_audio_out
      - i2c_name: i2c_master
        address: 0x30
        frequency: 400000
  - name: audio_adc
    type: audio_codec
    chip: es7210
    config:
      adc_enabled: true
      dac_enabled: false
      sys_cfg:
        no_mclk: false
      # MIC1/MIC2 are the front capsules, MIC3 loops back the ES8311 output as the AEC reference,
      # MIC4 is not connected. Labels run from MIC1 (LSB) to MIC4.
      adc_cfg:
        label: [FL, FR, RE, NA]
    peripherals:
      - i2s_name: i2s_audio_in
      - i2c_name: i2c_master
        address: 0x80
        frequency: 400000
  # App assets and audio prompts; the image is built from firmware/brookesia/spiffs into "storage".
  - name: fs_spiffs
    type: fs_spiffs
    config:
      base_path: "/spiffs"
      partition_label: storage
      max_files: 5
      format_if_mount_failed: false
  - name: sdcard_power_ctrl
    type: power_ctrl
    sub_type: gpio
    peripherals:
      - gpio_name: gpio_sd_power
        active_level: 0
  - name: fs_sdcard
    type: fs_fat
    sub_type: sdmmc
    power_ctrl_device: sdcard_power_ctrl
    config:
      vfs_config:
        format_if_mount_failed: false
      sub_config:
        slot: SDMMC_HOST_SLOT_0
        frequency: SDMMC_FREQ_HIGHSPEED
        bus_width: 4
        pins:                           # Slot 0 IOMUX pins
          clk: 43
          cmd: 44
          d0: 39
          d1: 40
          d2: 41
          d3: 42
          d4: -1
          d5: -1
          d6: -1
          d7: -1
          cd: -1
          wp: -1
        ldo_chan_id: 4
  - name: display_lcd
    type: display_lcd
    sub_type: dsi
    chip: jd9365
    dependencies:
      espressif/esp_lcd_jd9365: "^2.0.2"
    config:
      reset_gpio_num: 27
      rgb_ele_order: LCD_RGB_ELEMENT_ORDER_RGB
      bits_per_pixel: 16
      reset_active_high: 0
      dbi_config:
        virtual_channel: 0
        lcd_cmd_bits: 8
        lcd_param_bits: 8
      dpi_config:
        virtual_channel: 0
        dpi_clk_src: MIPI_DSI_DPI_CLK_SRC_DEFAULT
        dpi_clock_freq_mhz: 80
        pixel_format: LCD_COLOR_PIXEL_FORMAT_RGB565
        in_color_format: LCD_COLOR_FMT_RGB565
        out_color_format: LCD_COLOR_FMT_RGB565
        num_fbs: 3
        flags:
          use_dma2d: true
        video_timing:
          h_size: 720
          v_size: 720
          hsync_back_porch: 20
          hsync_pulse_width: 20
          hsync_front_porch: 40
          vsync_back_porch: 12
          vsync_pulse_width: 4
          vsync_front_porch: 24
    peripherals:
      - ldo_name: ldo_mipi
      - dsi_name: dsi_display
  - name: lcd_touch
    type: lcd_touch
    sub_type: i2c
    chip: gt911
    dependencies:
      espressif/esp_lcd_touch_gt911: "1.2.1"
    config:
      io_i2c_config:
        lcd_cmd_bits: 16
        scl_speed_hz: 400000
      touch_config:
        x_max: 720
        y_max: 720
        rst_gpio_num: 23
        int_gpio_num: -1
        levels:
          reset: 0                      # GT911 reset is active low
    peripherals:
      - i2c_name: i2c_master
        i2c_addr:
          - 0xBA
          - 0x28
  - name: backlight_power_ctrl
    type: power_ctrl
    sub_type: gpio
    peripherals:
      - gpio_name: gpio_backlight_control
        active_level: 1
  - name: lcd_brightness
    type: ledc_ctrl
    power_ctrl_device: backlight_power_ctrl
    config:
      default_percent: 0
    peripherals:
      - ledc_name: ledc_backlight
  - name: camera
    type: camera
    sub_type: csi
    config:
      csi_config:
        reset_io: -1
        pwdn_io: -1
        dont_init_ldo: true
    peripherals:
      - i2c_name: i2c_master
        frequency: 400000
      - ldo_name: ldo_mipi
