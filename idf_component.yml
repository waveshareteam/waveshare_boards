version: "0.3.5"
description: Waveshare board definitions for ESP Board Manager
license: Apache-2.0
url: https://github.com/waveshareteam/waveshare_boards
repository: https://github.com/waveshareteam/waveshare_boards.git
tags:
  - esp_board_manager
  - board_manager
  - boards
dependencies:
  # 0.7.5 is the board-pack baseline; CI tests this floor and the
  # newest stable version satisfying this range before compatibility is claimed.
  espressif/esp_board_manager:
    version: ">=0.7.5"
    require: public
files:
  exclude:
    - ".git/**/*"
    - ".github/**/*"
    - "ci/**/*"
    - "scripts/**/*"
    - "dist/**/*"
    - "**/__pycache__/**/*"
